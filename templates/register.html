<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ExamMatrix</title>

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/register.css">
</head>

<body>

  <div id="headerContainer"></div>

  <main id="main">
    <div id="registerCard" class="authCard">

      <div id="cardHero">
        <div class="logoMark">EM</div>
        <h2>Create account</h2>
        <p>Set up your ExamMatrix admin login</p>
      </div>

      <div id="cardBody">
        <p id="message"></p>

        <form id="registerForm">

          <div class="formField">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
          </div>

          <div class="formField">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password">
          </div>

          <div class="formField">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password">
          </div>

          <button type="submit" id="registerButton" class="btnPrimary">Create account</button>

        </form>

        <p id="loginRedirect">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>
      </div>

    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="js/auth-shared.js"></script>
  <script src="js/register.js"></script>

</body>
</html>
