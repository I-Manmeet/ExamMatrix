<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ExamMatrix</title>

<!-- SHARED THEME (theme.css comes from the landing-page member) -->
<link rel="stylesheet" href="css/theme.css">

<style>
  /* =========================================================
     REGISTRATION PAGE STYLES
     [ MEMBER 1 - ME ]  : base layout + structure styling
     [ MEMBER 2 - TODO ]: polish (focus, hover, errors, responsive)
  ========================================================= */

  /* [MEMBER 1] fallback variables (until theme.css exists) */
  :root{
    --emerald:#0f7a5c;
    --charcoal:#212b28;
    --bg:#f6f7f5;
    --paper:#ffffff;
    --ink:#1a1f1d;
    --ink-2:#4a534f;
    --ink-3:#8a938e;
    --line:#e4e8e4;
    --danger:#c0392b;
    --danger-soft:#fbe9e7;
    --emerald-soft:#d9efe7;
    --serif:"Iowan Old Style",Palatino,Georgia,serif;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:var(--ui);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* [MEMBER 1] main / centering */
  #main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
  }

  /* [MEMBER 1] registration card */
  #registerCard{
    width:410px;
    max-width:100%;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 12px 40px rgba(26,31,29,.12);
    overflow:hidden;
  }

  /* [MEMBER 1] card header band */
  #cardHero{
    background:var(--charcoal);
    color:#fff;
    padding:24px 30px;
  }
  #cardHero .logoMark{
    width:38px;height:38px;border-radius:10px;
    background:var(--emerald);
    display:grid;place-items:center;
    font-size:16px;font-weight:800;
    margin-bottom:12px;
  }
  #cardHero h2{font-family:var(--serif);font-size:22px;font-weight:600}
  #cardHero p{font-size:13px;opacity:.72;margin-top:2px}

  /* [MEMBER 1] form body */
  #cardBody{padding:26px 30px 30px}

  .formField{margin-bottom:15px}

  .formField label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-2);
    margin-bottom:6px;
  }

  .formField input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:var(--ui);
    font-size:14px;
    background:#fff;
  }

  /* [MEMBER 1] submit button (base only) */
  #registerButton{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--emerald);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  /* [MEMBER 1] message area */
/* =========================================================
   ERROR / SUCCESS MESSAGE
========================================================= */

  #message {
    font-size: 13px;
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
  }

/* Error message - light red box */

  #message.msg-error {
    display: block;
    color: #b42318;
    background: #fef3f2;
    border: 1px solid #fecdca;
  }

/* Success message - light green box */

  #message.msg-ok {
    display: block;
    color: #087f5b;
    background: #eaf8f3;
    border: 1px solid #b7e4d3;
  }

  /* [MEMBER 1] link row */
  #loginRedirect{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-2);
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  #loginRedirect a{color:var(--emerald);font-weight:700;text-decoration:none}


  /* =========================================================
     >>> [ MEMBER 2 - TODO: CSS POLISH ] <<<
       1. input :focus state (emerald border + soft ring)
       2. #registerButton:hover and :active states
       3. .msg-error / .msg-ok classes for #message
          (error = red on --danger-soft, ok = green on --emerald-soft)
       4. @media (max-width:600px) responsive tweaks
       5. .fieldError text under inputs
       (leave your name in a comment when done)
  ========================================================= */

</style>
</head>

<body>

  <!-- HEADER (header.html comes from landing-page member) -->
  <div id="headerContainer"></div>


  <!-- MAIN — [ MEMBER 1 - ME ] : full HTML structure -->
  <main id="main">

    <div id="registerCard">

      <div id="cardHero">
        <div class="logoMark">EM</div>
        <h2>Create account</h2>
        <p>Set up your ExamMatrix admin login</p>
      </div>

      <div id="cardBody">

        <p id="message"></p>

        <form id="registerForm">

          <div class="formField">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
          </div>

          <div class="formField">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
            <!-- [MEMBER 2] optional .fieldError text here -->
          </div>

          <div class="formField">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password">
          </div>

          <div class="formField">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password">
          </div>

          <button type="submit" id="registerButton">Create account</button>

        </form>

        <p id="loginRedirect">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>

      </div>

    </div>

  </main>


  <div id="footerContainer"></div>


<script>


  fetch("header.html")
    .then(function(res) {
      return res.text();
    })
    .then(function(html) {
      document.getElementById("headerContainer").innerHTML = html;
    })
    .catch(function() {
      console.log("header.html not added yet");
    });


  fetch("footer.html")
    .then(function(res) {
      return res.text();
    })
    .then(function(html) {
      document.getElementById("footerContainer").innerHTML = html;
    })
    .catch(function() {
      console.log("footer.html not added yet");
    });


  let registerForm = document.getElementById("registerForm");
  let message = document.getElementById("message");

  let emailInput = document.getElementById("email");
  let usernameInput = document.getElementById("username");
  let passwordInput = document.getElementById("password");
  let confirmPasswordInput = document.getElementById("confirmPassword");


  /* =====================================================
     PASSWORD VALIDATION
  ===================================================== */

  function getPasswordError(password) {

    let missing = [];

    if (!/[A-Z]/.test(password)) {
      missing.push("capital letter");
    }

    if (!/[a-z]/.test(password)) {
      missing.push("small letter");
    }

    if (!/[0-9]/.test(password)) {
      missing.push("number");
    }

    if (!/[!@#$%^&*(),.?":{}|<>_\-\\[\]/+=;'`~]/.test(password)) {
      missing.push("special character");
    }

    if (missing.length === 0) {
      return "";
    }

    if (missing.length === 1) {
      return "Add a " + missing[0] + ".";
    }

    if (missing.length === 2) {
      return "Add a " + missing[0] + " and " + missing[1] +".";
    }

    let last = missing.pop();
    return "Add a " + missing.join(", ") +", and " +last +".";

  }

  function validateRegistration(username,email,password,confirmPassword) {

    if (username === "" || email === "" || password === "" || confirmPassword === "") {
      return "Please fill in all fields.";
    }

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
      return "Please enter a valid email address.";
    }

    if (password.length < 6) {
      return "Password must be at least 6 characters.";
    }

    let passwordError = getPasswordError(password);

    if (passwordError !== "") {
      return passwordError;
    }

    if (password !== confirmPassword) {
      return "Passwords do not match.";

    }

    let users = JSON.parse(localStorage.getItem("em_users")) || [];

    for (let i = 0; i < users.length; i++) {
      if (
        users[i].username &&
        users[i].username.toLowerCase() ===
        username.toLowerCase()
      ) {
        return "That username is already taken.";
      }
    }

    for (let i = 0; i < users.length; i++) {
      if (
        users[i].email &&
        users[i].email.toLowerCase() ===
        email.toLowerCase()
      ) {
        return "That email is already registered.";
      }
    }
    return "";
  }

  function showMessage(text, isOk) {
    message.textContent = text;
    message.style.display = "block";
    if (isOk) {
      message.className = "msg-ok";
    } else {
      message.className = "msg-error";
    }
  }

  registerForm.addEventListener("submit", function(event) {
    event.preventDefault();

    let username = usernameInput.value.trim();
    let email = emailInput.value.trim();
    let password = passwordInput.value;
    let confirmPassword = confirmPasswordInput.value;
    let error =
      validateRegistration(
        username,
        email,
        password,
        confirmPassword
      );

    if (error !== "") {
      showMessage(error, false);
      return;
    }

    let users =
      JSON.parse(localStorage.getItem("em_users")) || [];

    users.push({
      username: username,
      email: email,
      password: password
    });

    localStorage.setItem(
      "em_users",
      JSON.stringify(users)
    );

    sessionStorage.setItem(
      "em_session",
      JSON.stringify({
        username: username,
        email: email
      })
    );

    showMessage(
      "Account created successfully! Redirecting to login...",
      true
    );

    setTimeout(function() {
      window.location.href = "login.html";
    }, 1000);

  });


</script>
