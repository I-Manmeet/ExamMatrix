<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ExamMatrix</title>

<!-- SHARED THEME (theme.css comes from the landing-page member) -->
<link rel="stylesheet" href="css/theme.css">

<style>
  /* =========================================================
     REGISTRATION PAGE STYLES
     [ MEMBER 1 - ME ]  : base layout + structure styling
     [ MEMBER 2 - TODO ]: polish (focus, hover, errors, responsive)
  ========================================================= */

  /* [MEMBER 1] fallback variables (until theme.css exists) */
  :root{
    --emerald:#0f7a5c;
    --charcoal:#212b28;
    --bg:#f6f7f5;
    --paper:#ffffff;
    --ink:#1a1f1d;
    --ink-2:#4a534f;
    --ink-3:#8a938e;
    --line:#e4e8e4;
    --danger:#c0392b;
    --danger-soft:#fbe9e7;
    --emerald-soft:#d9efe7;
    --serif:"Iowan Old Style",Palatino,Georgia,serif;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:var(--ui);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* [MEMBER 1] main / centering */
  #main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
  }

  /* [MEMBER 1] registration card */
  #registerCard{
    width:410px;
    max-width:100%;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 12px 40px rgba(26,31,29,.12);
    overflow:hidden;
  }

  /* [MEMBER 1] card header band */
  #cardHero{
    background:var(--charcoal);
    color:#fff;
    padding:24px 30px;
  }
  #cardHero .logoMark{
    width:38px;height:38px;border-radius:10px;
    background:var(--emerald);
    display:grid;place-items:center;
    font-size:16px;font-weight:800;
    margin-bottom:12px;
  }
  #cardHero h2{font-family:var(--serif);font-size:22px;font-weight:600}
  #cardHero p{font-size:13px;opacity:.72;margin-top:2px}

  /* [MEMBER 1] form body */
  #cardBody{padding:26px 30px 30px}

  .formField{margin-bottom:15px}

  .formField label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-2);
    margin-bottom:6px;
  }

  .formField input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:var(--ui);
    font-size:14px;
    background:#fff;
  }

  /* [MEMBER 1] submit button (base only) */
  #registerButton{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--emerald);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  /* [MEMBER 1] message area */
  #message{
    font-size:13px;
    padding:10px 13px;
    border-radius:9px;
    margin-bottom:15px;
    display:none;
  }

  /* [MEMBER 1] link row */
  #loginRedirect{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-2);
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  #loginRedirect a{color:var(--emerald);font-weight:700;text-decoration:none}


  /* =========================================================
     >>> [ MEMBER 2 - TODO: CSS POLISH ] <<<
       1. input :focus state (emerald border + soft ring)
       2. #registerButton:hover and :active states
       3. .msg-error / .msg-ok classes for #message
          (error = red on --danger-soft, ok = green on --emerald-soft)
       4. @media (max-width:600px) responsive tweaks
       5. .fieldError text under inputs
       (leave your name in a comment when done)
  ========================================================= */

</style>
</head>

<body>

  <!-- HEADER (header.html comes from landing-page member) -->
  <div id="headerContainer"></div>


  <!-- MAIN — [ MEMBER 1 - ME ] : full HTML structure -->
  <main id="main">

    <div id="registerCard">

      <div id="cardHero">
        <div class="logoMark">EM</div>
        <h2>Create account</h2>
        <p>Set up your ExamMatrix admin login</p>
      </div>

      <div id="cardBody">

        <p id="message"></p>

        <form id="registerForm">

          <div class="formField">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
            <!-- [MEMBER 2] optional .fieldError text here -->
          </div>

          <div class="formField">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password">
          </div>

          <div class="formField">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password">
          </div>

          <button type="submit" id="registerButton">Create account</button>

        </form>

        <p id="loginRedirect">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>

      </div>

    </div>

  </main>


  <!-- FOOTER (footer.html comes from landing-page member) -->
  <div id="footerContainer"></div>


  <script>

    /* =====================================================
       LOAD SHARED HEADER + FOOTER — [ MEMBER 1 - ME ]
    ===================================================== */
    fetch("header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("headerContainer").innerHTML = html; })
      .catch(() => console.log("header.html not added yet (landing-page member)"));

    fetch("footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footerContainer").innerHTML = html; })
      .catch(() => console.log("footer.html not added yet (landing-page member)"));


    /* =====================================================
       REGISTER FORM — SUBMIT SKELETON — [ MEMBER 1 - ME ]
    ===================================================== */
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    registerForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      // ---- call MEMBER 3's validation ----
      const error = validateRegistration(username, password, confirmPassword);

      if (error) {
        showMessage(error, false);
        return;
      }

      // ---- MEMBER 1: save the new user to LocalStorage ----
      const users = JSON.parse(localStorage.getItem("em_users")) || [];
      users.push({ username: username, password: password });
      localStorage.setItem("em_users", JSON.stringify(users));

      // start a session (SessionStorage)
      sessionStorage.setItem("em_session", JSON.stringify({ username: username }));

      showMessage("Account created! Redirecting…", true);
      setTimeout(function () { window.location.href = "dashboard.html"; }, 1000);
    });


    /* =====================================================
       showMessage() — [ MEMBER 1 - ME ] helper
    ===================================================== */
    function showMessage(text, isOk) {
      message.textContent = text;
      message.style.display = "block";
      message.className = isOk ? "msg-ok" : "msg-error";
    }


    /* =====================================================
       >>> [ MEMBER 3 - TODO: VALIDATION LOGIC ] <<<
       Return an ERROR STRING if something's wrong, or "" if all good.
         1. empty fields -> "Please fill in all fields."
         2. password !== confirmPassword -> "Passwords do not match."
         3. username taken (check em_users) -> "That username is already taken."
         4. (optional) password length < 6 -> "Password too short."
       Currently returns "" so the form runs while you build it.
       (leave your name in a comment when done)
    ===================================================== */
    function validateRegistration(username, password, confirmPassword) {

      // TODO [MEMBER 3]: replace with real checks
      return "";

    }

  </script>

</body>
</html>
