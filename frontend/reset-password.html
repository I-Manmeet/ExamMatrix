<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password - ExamMatrix</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/headerFooter.css">
</head>
<body>
  <div id="site-header-slot"></div>

  <main id="main">
    <div class="authCard">
      <div id="cardHero">
        <div class="logoMark">EM</div>
        <h2>Choose a new password</h2>
        <p>For your ExamMatrix admin account</p>
      </div>

      <div id="cardBody">
        <p id="message"></p>

        <form id="resetForm" novalidate>
          <div class="formField">
            <label for="password">New password</label>
            <div class="pwWrap">
              <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password" maxlength="64">
              <button type="button" class="pwToggle" data-target="password" aria-label="Show password">👁</button>
            </div>
          </div>

          <div class="formField">
            <label for="confirmPassword">Confirm new password</label>
            <div class="pwWrap">
              <input type="password" id="confirmPassword" placeholder="Repeat it" autocomplete="new-password" maxlength="64">
              <button type="button" class="pwToggle" data-target="confirmPassword" aria-label="Show password">👁</button>
            </div>
          </div>

          <ul id="passwordRules" class="pwRules">
            <li data-rule="length">6+ characters</li>
            <li data-rule="upper">Capital letter</li>
            <li data-rule="lower">Small letter</li>
            <li data-rule="number">Number</li>
            <li data-rule="special">Special character</li>
          </ul>

          <button type="submit" id="resetButton" class="btnPrimary">Update password</button>
        </form>

        <div id="resetDone" hidden>
          <div class="successIcon">✓</div>
          <p class="helpText centerText">Your password is updated.</p>
          <a href="login.html" class="btnPrimary btnLink">Go to login</a>
        </div>

        <p id="loginRedirect">Need a new link? <a href="forgot-password.html">Send another</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer-slot"></div>

  <script src="js/auth-shared.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth-api.js"></script>
  <script src="js/pw-toggle.js"></script>
  <script src="js/reset-password.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
