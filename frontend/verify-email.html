<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify email - ExamMatrix</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/headerFooter.css">
</head>

<body>
  <div id="site-header-slot"></div>

  <main id="main">
    <div class="authCard">
      <div id="cardHero">
        <div class="logoMark">EM</div>
        <h2>Verify your email</h2>
        <p>Confirm your ExamMatrix admin email</p>
      </div>

      <div id="cardBody">
        <p id="message"></p>
        <p id="verifyStatus" class="statusText">Checking your link...</p>

        <div id="verifyDone" hidden>
          <div class="successIcon">✓</div>
          <h3 class="doneTitle">University registered</h3>
          <p class="idLabel centerText">Your University ID</p>
          <div class="idBox">
            <span id="newUniId"></span>
            <button type="button" id="copyIdBtn">Copy</button>
          </div>
          <p class="helpText centerText">Save this ID. Students use it in Find My Seat. We've also emailed it to you.
          </p>
          <a href="login.html" class="btnPrimary btnLink">Go to login</a>
        </div>

        <form id="resendForm" novalidate hidden>
          <p class="helpText">Enter your admin email and we'll send a new link.</p>
          <div class="formField">
            <label for="email">Admin email</label>
            <input type="email" id="email" placeholder="admin@university.edu" autocomplete="email" maxlength="254">
          </div>
          <button type="submit" id="resendButton" class="btnPrimary">Send new link</button>
        </form>

        <p id="loginRedirect">Already verified? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer-slot"></div>

  <script src="js/auth-shared.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth-api.js"></script>
  <script src="js/verify-email.js"></script>
  <script src="js/theme.js"></script>
</body>

</html>
