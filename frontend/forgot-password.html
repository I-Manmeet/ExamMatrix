<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - ExamMatrix</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/headerFooter.css">
</head>
<body>
  <div id="site-header-slot"></div>

  <main id="main">
    <div class="authCard">
      <div id="cardHero">
        <div class="logoMark">EM</div>
        <h2>Forgot password</h2>
        <p>We'll email you a link to choose a new one</p>
      </div>

      <div id="cardBody">
        <p id="message"></p>

        <form id="forgotForm" novalidate>
          <div class="formField">
            <label for="email">Admin email</label>
            <input type="email" id="email" placeholder="admin@university.edu" autocomplete="email" maxlength="254">
          </div>
          <button type="submit" id="forgotButton" class="btnPrimary">Send reset link</button>
        </form>

        <p id="loginRedirect">Remembered it? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer-slot"></div>

  <script src="js/auth-shared.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth-api.js"></script>
  <script src="js/forgot-password.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
