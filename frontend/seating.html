<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View generated exam seating arrangements and find student seats in ExamHall.">
    <title>Seating Result - ExamMatrix</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/seating.css">
</head>

<body data-page="seating">

    <div id="navbarContainer"></div>
    <main id="seatingMain" class="seatingContainer">

        <!-- PAGE HEADER -->
        <section class="pageHead" aria-labelledby="seatingTitle">
            <div class="pageHeadContent">
                <h1 id="seatingTitle" class="pageTitle">
                    Seating result
                </h1>
                <p class="pageSub">
                    Legend · metrics · hall grids (color-coded) · controls + find-my-seat
                </p>
            </div>
        </section>

        <!-- EXAM INFORMATION & LEGEND -->
        <section class="metaSection" aria-labelledby="examTitle">
            <h2 id="examTitle" class="examTitle">Loading…</h2>
            <p id="examSub" class="examSub"></p>

            <!-- LEGEND -->
            <div class="legendCard" aria-label="Seating legend">
                <span class="legendLabel">LEGEND</span>
                <div id="legendSwatches" class="legendSwatches" role="list"></div>
            </div>
        </section>

        <!-- METRICS -->
        <section class="metricsGrid" aria-label="Seating metrics">
            <div class="metricCard">
                <span class="metricValue" id="metricConflicts">–</span>
                <span class="metricLabel">CONFLICTS</span>
            </div>

            <div class="metricCard">
                <span class="metricValue" id="metricHalls">–</span>
                <span class="metricLabel">HALLS USED</span>
            </div>

            <div class="metricCard">
                <span class="metricValue" id="metricUtilization">–</span>
                <span class="metricLabel">AVG UTILIZATION</span>
            </div>

            <div class="metricCard">
                <span class="metricValue" id="metricBacktracks">–</span>
                <span class="metricLabel">BACKTRACKS</span>
            </div>
        </section>

        <!-- HALL GRIDS (seating.js fills this) -->
        <section id="hallsContainer" class="hallsGrid" aria-label="Examination hall seating arrangements">
            <div class="hallCard" style="text-align:center;padding:40px 24px">Loading seating…</div>
        </section>

        <!-- CONTROLS & SEARCH -->
        <section class="card controlsCard" aria-label="Seating controls">
            <div class="actionButtons">

                <button type="button" class="btnSecondary" id="printBtn" onclick="window.print()">
                    <span>🖨</span> Print
                </button>

                <button type="button" class="btnSecondary" id="exportBtn">
                    <span>↓</span> Export CSV
                </button>
            </div>

            <div class="searchBox">
                <label for="seatSearchInput" class="srOnly">Find seat by roll number</label>
                <input type="search" id="seatSearchInput" name="seatSearch" placeholder="Find seat by roll #"
                    autocomplete="off">
            </div>
        </section>

    </main>
    <!-- Shared footer -->
    <div id="footerContainer"></div>

    <!-- server address + api() helper, then navbar/auth gate, then this page -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/seating.js"></script>

</body>

</html>
